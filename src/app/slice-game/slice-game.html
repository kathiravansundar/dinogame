<canvas
  #canvas
  class="game-canvas"
  aria-label="Fruit slicing game. Press and drag across the screen to slice fruit before time runs out."
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
></canvas>

<div class="controls">
  <button type="button" (click)="toggleSound()">
    {{ soundOn() ? '🔊 Sound on' : '🔇 Sound off' }}
  </button>
  <span class="hint">Press and drag to slice · 3+ in one swipe = combo</span>
</div>
