<canvas
  #canvas
  class="game-canvas"
  aria-label="Dino Runner. Press Space or tap to jump, Down arrow to duck."
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp()"
  (pointerleave)="onPointerUp()"
></canvas>

<div class="controls">
  <button type="button" (click)="toggleSound()">
    {{ soundOn() ? '🔊 Sound on' : '🔇 Sound off' }}
  </button>
  <span class="hint">Space / ↑ to jump · ↓ to duck</span>
</div>
